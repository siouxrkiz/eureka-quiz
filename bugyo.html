<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>しゅり配信うんちく上奏 出題者用</title><style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Outfit:wght@500;800&display=swap');
:root{--bg:#0c0d12;--bg2:#141621;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--fg:#f2efe9;--sub:#8e8c99;
--gold:#f5b942;--gold2:#ff7a45;--blue:#6aa8ff;--glow:rgba(245,185,66,.35)}
:root[data-theme=light]{--bg:#f5f2ec;--bg2:#ebe6dd;--card:rgba(255,255,255,.8);--line:rgba(0,0,0,.08);--fg:#1c1b20;--sub:#6c6875;--glow:rgba(245,140,66,.25)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--fg);font-family:"Zen Kaku Gothic New",system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 10% -10%,rgba(245,185,66,.12),transparent 60%),radial-gradient(900px 500px at 110% 10%,rgba(106,168,255,.10),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2) 900px);background-color:var(--bg2);min-height:100vh}
html{background:var(--bg2)}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.logo{font-family:Outfit,sans-serif;font-weight:800;letter-spacing:.18em;font-size:13px;color:var(--sub);text-transform:uppercase}
.logo b{background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:11px;letter-spacing:.12em;padding:4px 10px;border:1px solid var(--line);border-radius:99px;color:var(--sub)}
.tag.secret{border-color:rgba(255,122,69,.5);color:var(--gold2)}
.progress{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:10px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s ease}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.dots button{width:30px;height:30px;padding:0;border-radius:50%;font:600 12px Outfit,sans-serif;border:1px solid var(--line);background:transparent;color:var(--sub);cursor:pointer;transition:.2s}
.dots button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.qno{font-family:Outfit,sans-serif;font-weight:800;font-size:64px;line-height:1;letter-spacing:-.02em;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.qno small{font-size:16px;color:var(--sub);-webkit-text-fill-color:var(--sub);margin-left:8px;letter-spacing:.05em}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;margin-bottom:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.qcard{padding:28px 26px;box-shadow:0 20px 60px -30px var(--glow)}
.meta{font:500 12px Outfit,sans-serif;letter-spacing:.1em;color:var(--sub);margin:10px 0 14px}
.q{font-size:clamp(20px,4.6vw,26px);font-weight:700;line-height:1.75;letter-spacing:.01em}
nav{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
button{font:700 15px "Zen Kaku Gothic New",sans-serif;padding:12px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;transition:transform .15s,background .2s}
button:active{transform:scale(.97)}
button.p{background:linear-gradient(135deg,var(--gold),var(--gold2));border:0;color:#1a1208}
button.s{background:transparent;border-color:var(--blue);color:var(--blue)}
.grow{flex:1}
.hint{margin:10px 0;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);animation:in .35s ease both}
.hint b{font:800 12px Outfit,sans-serif;letter-spacing:.14em;color:var(--blue);display:block;margin-bottom:2px}
.ans{font-size:19px;font-weight:700;line-height:1.7}
.anscard{border:1px solid transparent;background:linear-gradient(var(--bg2),var(--bg2)) padding-box,linear-gradient(135deg,var(--gold),var(--gold2)) border-box;animation:in .4s ease both}
.anscard .label{font:800 12px Outfit,sans-serif;letter-spacing:.2em;color:var(--gold);margin-bottom:6px}
.memo{margin:8px 0 0;padding-left:1.1em}.memo li{margin:6px 0;color:var(--fg)}.memo li::marker{color:var(--gold)}
.h2{font:800 12px Outfit,sans-serif;letter-spacing:.2em;color:var(--sub)}
.timer{font:800 44px Outfit,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer.low{color:var(--gold2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hidden{display:none}
.rule{font-size:14px;color:var(--sub)}.ttl{font-size:26px;font-weight:900;line-height:1.35;color:var(--fg);margin-bottom:10px;letter-spacing:.02em}.rule b{color:var(--gold)}
.eureka{font-weight:900;white-space:nowrap}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.swap{animation:in .35s ease both}
.who{display:flex;align-items:center;gap:10px}.who b{font-size:17px}.who a{font-size:12px;color:var(--sub);cursor:pointer;text-decoration:underline}
.koku{font:800 15px Outfit,sans-serif;color:var(--gold)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#666;margin-right:6px;vertical-align:middle}.live.on{background:#3ddc84;box-shadow:0 0 8px #3ddc84}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:14px}
.names button{padding:16px 10px}
input[type=text]{font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);min-width:0;flex:1}
.joso{width:100%;padding:22px;font-size:26px;font-weight:900;letter-spacing:.1em;border-radius:20px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1208;border:0;box-shadow:0 14px 40px -12px var(--glow)}
.joso:disabled{opacity:.45}
.board{list-style:none;margin:8px 0 0;padding:0}.board li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.board li.me{color:var(--gold)}.rk{display:inline-block;font:800 13px Outfit,sans-serif;color:var(--sub);width:26px}
.queue{list-style:none;margin:8px 0 0;padding:0}.queue li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.queue li .n{flex:1;font-weight:700}
.queue button{padding:8px 12px;font-size:13px}.queue .ok{background:#1f9d55;border:0;color:#fff}.queue .ng{background:#c0392b;border:0;color:#fff}
.queue li.done{opacity:.5}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);padding:14px 22px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);font-weight:900;font-size:18px;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:opacity .5s;white-space:nowrap}
.toast.ok{border-color:#3ddc84;color:#3ddc84}.toast.ng{border-color:#ff6b5b;color:#ff6b5b}.toast.out{opacity:0}
.small{font-size:12px;color:var(--sub)}
.mini{padding:6px 10px;font-size:12px;border-radius:10px}
.inrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.joso.kinshin{background:#3a3a44;color:#bbb;box-shadow:none;opacity:1;animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style></head><body><div class="wrap"><div id="lock"><header><div class="logo">Syuri Haishin <b>上奏</b></div><span class="tag">HOST ONLY</span></header>
<div class="card rule"><div class="ttl">出題者用</div>パスワードを入れてください。一度入れると、この端末は次から自動で開きます。（数秒かかります）</div>
<div class="card"><div class="inrow"><input type="password" id="pw" placeholder="パスワード" autocomplete="current-password"><button class="p" id="pwok">開く</button></div><div class="small" id="pwmsg" style="margin-top:8px"></div></div></div>
<div id="app" class="hidden"><header><div class="logo">Syuri Haishin <b>上奏</b></div><span class="tag secret"><span class="live" id="live"></span>HOST ONLY</span></header>
<div class="progress"><i id="bar"></i></div>
<div class="dots" id="dots"></div>
<div class="card qcard swap" id="qc"><div class="qno" id="qno"></div><div class="meta" id="meta"></div><div class="q" id="q"></div></div>
<nav><button class="p grow" id="send">この問題を出題する</button></nav>
<div class="small" id="sendmsg" style="margin:-4px 0 10px"></div>
<nav><button class="s grow" id="hb">ヒント 0/3</button><button class="grow" id="ab">答えを見る</button><button class="grow" id="abc">答えを全員に公開</button></nav>
<div id="hints"></div>
<div class="card anscard hidden" id="ansbox"><div class="label">ANSWER</div><div class="ans" id="ans"></div></div>
<div class="card"><div class="row"><div class="h2">上奏の順番（この問題）</div><button class="mini" id="qclear">クリア</button></div><ul class="queue" id="queue"></ul><div class="small" id="qempty">まだ誰も上奏していません</div></div>
<div class="card"><div class="h2">YES / NO MEMO</div><ul class="memo" id="facts"></ul></div>
<div class="card row"><div><div class="h2">TIMER</div><div class="timer" id="tm">2:00</div></div><nav style="margin:0"><button id="ts">スタート</button><button id="tr">リセット</button></nav></div>
<div class="card"><div class="h2">石高（＋/−で手動調整）</div><ul class="board" id="board"></ul>
<div class="inrow"><input type="text" id="addn" placeholder="名簿に追加"><button class="mini" id="addb">追加</button></div>
<div class="inrow small">加増 <input type="text" id="up" value="10000" style="max-width:90px"> 石　切腹 <input type="text" id="down" value="-5000" style="max-width:90px"> 石</div>
<div class="inrow"><button class="mini" id="reset">石高を全部リセット</button></div></div>
<nav><button class="grow" id="prev">← 前の問題</button><button class="grow" id="next">次の問題 →</button></nav>

// ntfy.sh を使った簡易リアルタイム通信（出題者・参加者で共通）
const NTFY = "https://ntfy.sh";

function esc(t) {
  return String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function koku(n) {
  const v = Number(n) || 0;
  const sign = v < 0 ? "−" : "";
  const a = Math.abs(v);
  if (a >= 10000) return `${sign}${(a / 10000).toFixed(a % 10000 ? 1 : 0)}万石`;
  return `${sign}${a}石`;
}

async function publish(topic, obj) {
  try {
    const res = await fetch(`${NTFY}/${topic}`, { method: "POST", body: JSON.stringify(obj) });
    return res.ok;
  } catch (e) {
    console.warn("publish failed", e);
    return false;
  }
}

async function fetchRecent(topic, since) {
  try {
    const res = await fetch(`${NTFY}/${topic}/json?poll=1&since=${since}`);
    if (!res.ok) return [];
    const text = await res.text();
    return text.split("\n").filter(Boolean).map((l) => {
      try { return JSON.parse(JSON.parse(l).message); } catch (e) { return null; }
    }).filter(Boolean);
  } catch (e) {
    console.warn("poll failed", e);
    return [];
  }
}

function subscribe(topic, onMsg, onStatus) {
  let retry = 1000;
  const open = () => {
    const es = new EventSource(`${NTFY}/${topic}/sse`);
    es.onopen = () => { retry = 1000; if (onStatus) onStatus(true); };
    es.onmessage = (ev) => {
      try {
        const outer = JSON.parse(ev.data);
        if (outer.event !== "message") return;
        onMsg(JSON.parse(outer.message));
      } catch (e) { /* 形式の違うメッセージは無視 */ }
    };
    es.onerror = () => {
      if (onStatus) onStatus(false);
      es.close();
      setTimeout(open, retry);
      retry = Math.min(retry * 2, 15000);
    };
  };
  open();
}

function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = `toast ${kind || ""}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.classList.add("out"), 2600);
  setTimeout(() => el.remove(), 3200);
}

function startApp(){
const TOPIC = DATA.topic;
const Q = [{ ...DATA.sample, id: "例題", date: "練習", facts: ["例題（スープの話）。上奏ボタンのテスト用", "2021年 syuri の実話"] }, ...DATA.quiz];
const TOTAL = Q.length - 1;
const $ = (id) => document.getElementById(id);
$("topic").textContent = TOPIC;

// 出題者の状態。localStorage に保存して、再読み込みしても続きから再開できる
let S = { i: 0, h: 0, scores: {}, roster: DATA.roster, queue: [], ansPub: false, sentNo: null, v: 0 };
try { S = { ...S, ...JSON.parse(localStorage.getItem("joso-host") || "{}") }; } catch (e) {}
const save = () => { try { localStorage.setItem("joso-host", JSON.stringify(S)); } catch (e) {} };

function stateMsg(last) {
  const d = Q[S.i];
  S.v = Math.max(Date.now(), (S.v || 0) + 1);
  const live = S.sentNo === S.i && S.i > 0;
  const cur = live ? { no: S.i, total: TOTAL, q: d.q, hints: d.hints.slice(0, S.h), ans: S.ansPub ? d.a : null } : null;
  return { type: "state", v: S.v, cur, scores: S.scores, roster: S.roster, last: last || null };
}
async function push(last) {
  save();
  const ok = await publish(TOPIC, stateMsg(last));
  if (!ok) $("sendmsg").textContent = "⚠ 送信に失敗しました。もう一度押してください。";
}

function renderDots() {
  $("dots").innerHTML = "";
  Q.forEach((_, k) => {
    const b = document.createElement("button"); b.textContent = k ? k : "例";
    if (k === S.i) b.className = "on"; b.onclick = () => go(k); $("dots").appendChild(b);
  });
}
function renderQuestion() {
  const d = Q[S.i];
  $("qno").innerHTML = S.i ? `Q.${String(S.i).padStart(2, "0")}<small>/ ${TOTAL}</small>` : "例題";
  $("meta").textContent = `${d.date}　·　${d.id}`; $("q").textContent = d.q;
  $("bar").style.width = `${(S.i / TOTAL) * 100}%`;
  const qc = $("qc"); qc.classList.remove("swap"); void qc.offsetWidth; qc.classList.add("swap");
  $("hints").innerHTML = d.hints.slice(0, S.h).map((h, k) => `<div class="hint"><b>HINT ${k + 1}</b>${esc(h)}</div>`).join("");
  $("hb").textContent = `ヒント ${S.h}/3`;
  $("ans").textContent = d.a;
  $("facts").innerHTML = d.facts.map((f) => `<li>${esc(f)}</li>`).join("");
  $("sendmsg").textContent = S.sentNo === S.i ? (S.i ? "出題中（参加者の画面に表示されています）" : "例題モード") : "まだ参加者には見えていません";
  renderDots(); renderQueue(); renderBoard();
}
function go(k) {
  S.i = Math.max(0, Math.min(Q.length - 1, k)); S.h = 0; S.ansPub = false; S.queue = [];
  $("ansbox").classList.add("hidden"); $("ab").textContent = "答えを見る";
  resetTimer(); renderQuestion(); save();
}

$("send").onclick = async () => {
  S.sentNo = S.i; S.h = 0; S.ansPub = false; S.queue = [];
  renderQuestion(); await push();
};
$("hb").onclick = async () => {
  const d = Q[S.i]; if (S.h >= d.hints.length) return;
  S.h++; renderQuestion(); if (S.sentNo === S.i) await push(); else save();
};
$("ab").onclick = () => { const x = $("ansbox").classList.toggle("hidden"); $("ab").textContent = x ? "答えを見る" : "答えを隠す"; };
$("abc").onclick = async () => {
  if (S.sentNo !== S.i || !S.i) { $("sendmsg").textContent = "先に「この問題を出題する」を押してください"; return; }
  S.ansPub = true; await push(); $("sendmsg").textContent = "答えを全員に公開しました";
};

function renderQueue() {
  const q = S.queue;
  $("qempty").classList.toggle("hidden", q.length > 0);
  $("queue").innerHTML = q.map((j, k) => `<li class="${j.res ? "done" : ""}"><span class="rk">${k + 1}</span><span class="n">${esc(j.name)}</span>${
    j.res ? `<span>${j.res === "ok" ? "加増" : "切腹"}</span>`
      : `<button class="ok" data-k="${k}" data-r="ok">加増</button><button class="ng" data-k="${k}" data-r="ng">切腹</button>`}</li>`).join("");
  $("queue").querySelectorAll("button").forEach((b) => (b.onclick = () => judge(Number(b.dataset.k), b.dataset.r)));
}
async function judge(k, r) {
  const j = S.queue[k]; if (!j || j.res) return;
  j.res = r;
  const amt = Number(r === "ok" ? $("up").value : $("down").value) || 0;
  S.scores = { ...S.scores, [j.name]: (S.scores[j.name] || 0) + amt };
  if (!S.roster.includes(j.name)) S.roster = [...S.roster, j.name];
  renderQueue(); renderBoard(); await push({ name: j.name, kind: r, ts: Date.now() });
}
$("qclear").onclick = () => { S.queue = []; renderQueue(); save(); };

function renderBoard() {
  const names = [...new Set([...S.roster, ...Object.keys(S.scores)])];
  const rows = names.map((n) => [n, S.scores[n] || 0]).sort((a, b) => b[1] - a[1]);
  $("board").innerHTML = rows.map(([n, v], i) => `<li><span><span class="rk">${i + 1}</span>${esc(n)}</span><span><span class="koku">${koku(v)}</span> <button class="mini" data-n="${esc(n)}" data-d="1000">+</button><button class="mini" data-n="${esc(n)}" data-d="-1000">−</button></span></li>`).join("");
  $("board").querySelectorAll("button").forEach((b) => (b.onclick = async () => {
    S.scores = { ...S.scores, [b.dataset.n]: (S.scores[b.dataset.n] || 0) + Number(b.dataset.d) };
    renderBoard(); await push();
  }));
}
$("addb").onclick = async () => {
  const n = $("addn").value.trim().slice(0, 30);
  if (n && !S.roster.includes(n)) { S.roster = [...S.roster, n]; $("addn").value = ""; renderBoard(); await push(); }
};
$("reset").onclick = async () => { if (!confirm("石高を全員0に戻しますか？")) return; S.scores = {}; renderBoard(); await push(); };
$("prev").onclick = () => go(S.i - 1);
$("next").onclick = () => go(S.i + 1);

let tl = 120, tid = null;
function fmt() { $("tm").textContent = `${Math.floor(tl / 60)}:${String(tl % 60).padStart(2, "0")}`; $("tm").classList.toggle("low", tl <= 30); }
function resetTimer() { clearInterval(tid); tid = null; tl = 120; fmt(); $("ts").textContent = "スタート"; }
$("ts").onclick = () => {
  if (tid) { clearInterval(tid); tid = null; $("ts").textContent = "再開"; return; }
  $("ts").textContent = "一時停止";
  tid = setInterval(() => { tl = Math.max(0, tl - 1); fmt(); if (!tl) { clearInterval(tid); tid = null; } }, 1000);
};
$("tr").onclick = resetTimer;

const seen = new Set(S.queue.map((j) => j.id));
subscribe(TOPIC, (m) => {
  if (m.type !== "joso" || !m.id || seen.has(m.id)) return;
  seen.add(m.id);
  const curNo = S.sentNo === S.i ? S.i : 0;
  if ((m.no || 0) !== curNo) return;
  S.queue = [...S.queue, { id: m.id, name: String(m.name || "?").slice(0, 30), ts: m.ts, res: null }];
  renderQueue(); save(); toast(`${m.name} 殿が上奏！`);
}, (on) => $("live").classList.toggle("on", on));

resetTimer(); renderQuestion();

}

async function unlock(pw){const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const e=new TextEncoder();
 const base=await crypto.subtle.importKey('raw',e.encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(ENC.salt),iterations:ENC.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(ENC.iv)},key,b(ENC.ct));return JSON.parse(new TextDecoder().decode(pt))}
async function tryOpen(pw,remember){document.getElementById('pwmsg').textContent='確認中…';try{DATA=await unlock(pw)}catch(e){document.getElementById('pwmsg').textContent='パスワードが違います';try{localStorage.removeItem('joso-hostpw')}catch(x){}return}
 if(remember){try{localStorage.setItem('joso-hostpw',pw)}catch(e){}}
 document.getElementById('lock').classList.add('hidden');document.getElementById('app').classList.remove('hidden');startApp()}
document.getElementById('pwok').onclick=()=>tryOpen(document.getElementById('pw').value.trim(),true);
document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')document.getElementById('pwok').click()};
(()=>{let s=null;try{s=localStorage.getItem('joso-hostpw')}catch(e){}if(s)tryOpen(s,false)})();
