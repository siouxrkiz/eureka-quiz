// ntfy.sh を使った簡易リアルタイム通信（出題者・参加者で共通）
const NTFY = "https://ntfy.sh";

function esc(t) {
  return String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function koku(n) {
  const v = Number(n) || 0;
  const sign = v < 0 ? "−" : "";
  const a = Math.abs(v);
  if (a >= 10000) return `${sign}${(a / 10000).toFixed(a % 10000 ? 1 : 0)}万石`;
  return `${sign}${a}石`;
}

// ---- 通信: ntfy.sh と公開 MQTT ブローカー2つの計3系統。どれか1つ届けば動く ----
const BROKERS = ["wss://broker.hivemq.com:8884/mqtt", "wss://broker.emqx.io:8084/mqtt"];
const LINK = { ntfy: false };
let mqttClients = null, statusCb = null;
const mqttTopic = (topic) => `syuri-joso/${topic}`;
function linkChanged() { if (statusCb) statusCb(Object.values(LINK).some(Boolean)); }

function ensureMqtt(topic, onMsg) {
  if (mqttClients || typeof mqtt === "undefined") return mqttClients || [];
  mqttClients = BROKERS.map((url, k) => {
    const key = `mqtt${k}`; LINK[key] = false;
    const c = mqtt.connect(url, { clientId: `joso_${Math.random().toString(16).slice(2, 12)}`, connectTimeout: 8000, reconnectPeriod: 3000, clean: true });
    c.on("connect", () => { LINK[key] = true; linkChanged(); c.subscribe(mqttTopic(topic)); });
    c.on("close", () => { LINK[key] = false; linkChanged(); });
    c.on("error", () => {});
    c.on("message", (_t, buf) => { try { if (onMsg) onMsg(JSON.parse(buf.toString())); } catch (e) { /* 形式違いは無視 */ } });
    return c;
  });
  return mqttClients;
}

async function publishNtfy(topic, body) {
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 8000);
    const res = await fetch(`${NTFY}/${topic}`, { method: "POST", body, signal: ctl.signal });
    clearTimeout(timer);
    return res.ok;
  } catch (e) {
    return false;
  }
}

async function publish(topic, obj) {
  const body = JSON.stringify(obj);
  let sent = false;
  // state は「最新の状態」として保持（retain）し、後から開いた人にも届くようにする
  (mqttClients || []).forEach((c) => {
    if (c.connected) { c.publish(mqttTopic(topic), body, { qos: 0, retain: obj.type === "state" }); sent = true; }
  });
  const ok = await publishNtfy(topic, body);
  return sent || ok;
}

async function fetchRecent(topic, since) {
  try {
    // 通信サービスが応答しないときに画面が止まらないよう、5秒で打ち切る
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 5000);
    const res = await fetch(`${NTFY}/${topic}/json?poll=1&since=${since}`, { signal: ctl.signal });
    clearTimeout(timer);
    if (!res.ok) return [];
    const text = await res.text();
    return text.split("\n").filter(Boolean).map((l) => {
      try { return JSON.parse(JSON.parse(l).message); } catch (e) { return null; }
    }).filter(Boolean);
  } catch (e) {
    return [];
  }
}

function subscribe(topic, onMsg, onStatus) {
  statusCb = onStatus;
  ensureMqtt(topic, onMsg);
  let retry = 1000;
  const open = () => {
    const es = new EventSource(`${NTFY}/${topic}/sse`);
    es.onopen = () => { retry = 1000; LINK.ntfy = true; linkChanged(); };
    es.onmessage = (ev) => {
      try {
        const outer = JSON.parse(ev.data);
        if (outer.event !== "message") return;
        onMsg(JSON.parse(outer.message));
      } catch (e) { /* 形式の違うメッセージは無視 */ }
    };
    es.onerror = () => {
      LINK.ntfy = false; linkChanged();
      es.close();
      setTimeout(open, retry);
      retry = Math.min(retry * 2, 30000);
    };
  };
  open();
}

function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = `toast ${kind || ""}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.classList.add("out"), 2600);
  setTimeout(() => el.remove(), 3200);
}

// 判子の演出（加増・切腹・謹慎など）。加増のときは紙吹雪も出す
function stamp(text, kind, sub) {
  const wrap = document.createElement("div");
  wrap.className = `stampwrap ${kind || ""}`;
  const imgs = (typeof DATA !== "undefined" && DATA && DATA.img) || {};
  const pic = imgs[{ ok: "kazo", ng: "seppuku", wait: "kinshin" }[kind]];
  wrap.innerHTML = `${pic ? `<img class="stampimg" src="${pic}" alt="">` : ""}<div class="stamp"><span>${esc(text)}</span></div>${sub ? `<div class="stampsub">${esc(sub)}</div>` : ""}`;
  document.body.appendChild(wrap);
  if (kind === "ok") confetti();
  setTimeout(() => wrap.classList.add("out"), 1900);
  setTimeout(() => wrap.remove(), 2500);
}
function confetti() {
  const colors = ["#f5b942", "#ff7a45", "#ffe08a", "#ffffff", "#e8434f"];
  const box = document.createElement("div");
  box.className = "confetti";
  for (let k = 0; k < 60; k++) {
    const p = document.createElement("i");
    p.style.left = `${Math.random() * 100}%`;
    p.style.background = colors[k % colors.length];
    p.style.animationDelay = `${Math.random() * 0.4}s`;
    p.style.animationDuration = `${1.6 + Math.random() * 1.2}s`;
    p.style.transform = `rotate(${Math.random() * 360}deg)`;
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 3200);
}

// data-img 属性の付いた <img> に装飾画像を入れる
function fillImages() {
  const imgs = (typeof DATA !== "undefined" && DATA && DATA.img) || {};
  document.querySelectorAll("img[data-img]").forEach((el) => { if (imgs[el.dataset.img]) el.src = imgs[el.dataset.img]; else el.remove(); });
}

function startApp(){
const TOPIC = DATA.topic;
fillImages();
const $ = (id) => document.getElementById(id);
let me = null, state = null, lastJoso = 0;
try { me = localStorage.getItem("joso-me"); } catch (e) {}

function showPick() {
  $("pick").classList.remove("hidden"); $("main").classList.add("hidden");
  $("names").innerHTML = "";
  (state?.roster || DATA.roster).forEach((n) => {
    const b = document.createElement("button"); b.textContent = n; b.onclick = () => setMe(n); $("names").appendChild(b);
  });
}
function setMe(n) {
  me = String(n || "").trim().slice(0, 30); if (!me) return;
  try { localStorage.setItem("joso-me", me); } catch (e) {}
  $("pick").classList.add("hidden"); $("main").classList.remove("hidden"); render();
}
$("otherok").onclick = () => setMe($("other").value);
$("change").onclick = showPick;

function render() {
  if (!me) return;
  $("me").textContent = me;
  const sc = state?.scores || {};
  $("mykoku").textContent = koku(sc[me] || 0);
  const cur = state?.cur;
  if (cur) {
    $("qno").innerHTML = cur.no ? `Q.${String(cur.no).padStart(2, "0")}<small>/ ${cur.total}</small>` : "例題";
    $("q").textContent = cur.q; $("qnote").textContent = ""; $("waitrow").classList.add("hidden");
  } else {
    $("qno").textContent = "例題"; $("q").textContent = DATA.sample.q; $("waitrow").classList.remove("hidden");
    $("qnote").textContent = "出題を待っています。出題者が出題すると、ここに問題が自動で表示されます。上奏ボタンのテストはいつでもできます。";
  }
  $("hints").innerHTML = (cur?.hints || []).map((h, i) => `<div class="hint"><b>HINT ${i + 1}</b>${esc(h)}</div>`).join("");
  const ansText = cur ? cur.ans : null;
  if (ansText) { $("ansbox").classList.remove("hidden"); $("ans").textContent = ansText; } else $("ansbox").classList.add("hidden");
  const names = [...new Set([...(state?.roster || DATA.roster), ...Object.keys(sc)])];
  const rows = names.map((n) => [n, sc[n] || 0]).sort((a, b) => b[1] - a[1]);
  $("board").innerHTML = rows.map(([n, v], i) => `<li class="${n === me ? "me" : ""}"><span><span class="rk">${i + 1}</span>${esc(n)}</span><span class="koku">${koku(v)}</span></li>`).join("");
}

// 連打対策: 前回の上奏から RAPID_MS 以内にもう一度押すと「謹慎」で KINSHIN_MS 押せなくなる
const RAPID_MS = 1500, KINSHIN_MS = 3000;
let kinshinUntil = 0, kinshinTimer = null;
function enterKinshin() {
  kinshinUntil = Date.now() + KINSHIN_MS;
  const btn = $("joso"); btn.classList.add("kinshin"); btn.disabled = true;
  $("josomsg").textContent = "謹慎"; stamp("謹慎", "wait", "連打はご法度");
  clearInterval(kinshinTimer);
  const tick = () => {
    const left = Math.ceil((kinshinUntil - Date.now()) / 1000);
    if (left <= 0) {
      clearInterval(kinshinTimer); btn.classList.remove("kinshin"); btn.disabled = false;
      btn.textContent = "上奏！"; $("josomsg").textContent = "謹慎が解けました。";
      return;
    }
    btn.textContent = `謹慎中 ${left}`;
  };
  tick(); kinshinTimer = setInterval(tick, 200);
}
$("joso").onclick = async () => {
  if (!me) return showPick();
  const now = Date.now();
  if (now < kinshinUntil) return;
  if (now - lastJoso < RAPID_MS) { enterKinshin(); return; }
  lastJoso = now;
  const no = state?.cur?.no || 0;
  const ok = await publish(TOPIC, { type: "joso", name: me, no, ts: now, id: `${me}-${now}` });
  if (Date.now() < kinshinUntil) return;
  $("josomsg").textContent = ok
    ? (no ? `第${no}問に上奏しました。出題者の沙汰を待て。` : "例題に上奏しました。出題者の沙汰を待て。")
    : "送信できませんでした。電波を確認してもう一度。";
};

// 出題者のタイマーを表示（端末の時計で残りを計算）
function timerLeft() {
  const t = state?.timer; if (!t) return null;
  return t.run ? Math.max(0, Math.round(t.left - (Date.now() - t.at) / 1000)) : t.left;
}
function renderTimer() {
  const t = state?.timer, left = timerLeft();
  const show = t && (t.run || left < 120);
  $("timerbox").classList.toggle("hidden", !show);
  if (!show) return;
  $("ptm").textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
  $("ptm").classList.toggle("low", left <= 30);
}
setInterval(renderTimer, 250);

function onMsg(m) {
  if (m.type !== "state") return;
  if (state && m.v <= state.v) return;
  state = m; render();
  if (m.last && m.last.name && m.last.ts > Date.now() - 15000) {
    const ok = m.last.kind === "ok";
    stamp(ok ? "加増" : "切腹", ok ? "ok" : "ng", `${m.last.name} 殿`);
  }
}

(async () => {
  const hist = await fetchRecent(TOPIC, "12h");
  hist.filter((m) => m.type === "state").forEach((m) => { if (!state || m.v > state.v) state = m; });
  if (me) setMe(me); else showPick();
  subscribe(TOPIC, onMsg, (on) => { $("live").classList.toggle("on", on); $("livet").textContent = on ? "LIVE" : "再接続中"; });
})();


}

async function unlock(pw){const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const e=new TextEncoder();
 const base=await crypto.subtle.importKey('raw',e.encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(ENC.salt),iterations:ENC.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(ENC.iv)},key,b(ENC.ct));return JSON.parse(new TextDecoder().decode(pt))}
async function tryOpen(pw,remember){document.getElementById('pwmsg').textContent='確認中…';try{DATA=await unlock(pw)}catch(e){document.getElementById('pwmsg').textContent='パスワードが違います';try{localStorage.removeItem('joso-playpw')}catch(x){}return}
 if(remember){try{localStorage.setItem('joso-playpw',pw)}catch(e){}}
 document.getElementById('lock').classList.add('hidden');document.getElementById('app').classList.remove('hidden');startApp()}
document.getElementById('pwok').onclick=()=>tryOpen(document.getElementById('pw').value.trim(),true);
document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')document.getElementById('pwok').click()};
(()=>{let s=null;try{s=localStorage.getItem('joso-playpw')}catch(e){}if(s)tryOpen(s,false)})();
document.getElementById('logout').onclick=()=>{if(!confirm('ログアウトしますか？（次に開くときパスワードが必要になります）'))return;try{localStorage.removeItem('joso-playpw')}catch(e){}location.reload()};
